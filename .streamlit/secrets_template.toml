# Modèle des "Secrets" à renseigner sur share.streamlit.io (Settings > Secrets).
# NE PAS mettre les vraies valeurs dans ce fichier ni sur GitHub !
# Les valeurs viennent du fichier JSON de la clé du compte de service Google.

[connections.gsheets]
spreadsheet = "URL_DE_VOTRE_GOOGLE_SHEET"
type = "service_account"
project_id = "xxx"
private_key_id = "xxx"
private_key = "-----BEGIN PRIVATE KEY-----\nxxx\n-----END PRIVATE KEY-----\n"
client_email = "xxx@xxx.iam.gserviceaccount.com"
client_id = "xxx"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "xxx"
